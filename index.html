<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Contact Form</title>
    <link href="styles.css" rel="stylesheet">
</head>

 <body>
<div class="form-container">
    <h2>Contact Us</h2>
    <form>
        <label for="name">Name:<input id="name" type="text" name="name" required /></label>
        <label for="email">Email:<input id="email" type="email" name="email" required /></label>
        <label for="message">Message:<textarea rows="3" cols="30" id="message" name="message" required></textarea></label>
        <button type="submit">Submit</button>
    </form>
</div>
</body>

</html>
